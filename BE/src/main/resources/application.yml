server:
  port: ${SERVER_PORT:5000}
  forward-headers-strategy: framework

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: phongtro247-housing-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rental_room_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 100MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5176,http://localhost:3000}
  security:
    jwt-secret: ${JWT_SECRET:replace-with-a-long-random-secret-at-least-32-characters}
    jwt-expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}
  storage:
    uploads-directory: ${UPLOADS_DIRECTORY:./uploads}
  payment:
    momo:
      api-url: ${MOMO_API_URL:https://test-payment.momo.vn}
      access-key: ${MOMO_ACCESS_KEY:}
      secret-key: ${MOMO_SECRET_KEY:}
      partner-code: ${MOMO_PARTNER_CODE:MOMO}
      redirect-url: ${MOMO_REDIRECT_URL:http://localhost:5176/payment-result}
      ipn-url: ${MOMO_IPN_URL:http://localhost:5000/api/payment/momo/callback}

logging:
  level:
    com.phongtro247.housing: INFO
